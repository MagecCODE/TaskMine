<ion-header [translucent]="true">  
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
      <ion-title class="title-form">Task</ion-title>
    </ion-buttons> 
    <ion-buttons slot="end"> 
      <ion-menu-toggle auto-hide="false" menu="userMenu">
        <ion-avatar class="custom-avatar">
          <ion-icon name="person-circle-outline"></ion-icon>
        </ion-avatar>
      </ion-menu-toggle>   
    </ion-buttons>
  </ion-toolbar>
</ion-header> 

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">TaskForm</ion-title>
    </ion-toolbar>
  </ion-header>

<!-- Card Task -->
  <ion-card 
  class="task-form-card">
    <ion-card-header>
      <ion-card-title class="car-tittle">{{ isEditMode ? 'Actualizar Task' : 'Nueva Task' }}</ion-card-title>
    </ion-card-header>
    <ion-card-content class="card-content">

      <!-- #Formulario de Tasks --> 
      <form [formGroup]="taskForm" (ngSubmit)="onSubmit()">

        <ion-item>
          <ion-label position="stacked">Título</ion-label>
          <ion-input formControlName="title" type="text" placeholder="Title"></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="taskForm.get('title')?.touched && taskForm.get('title')?.hasError('required')">
          Title is required
        </ion-note>
        
        <ion-item>
          <ion-label position="stacked">Task</ion-label>
          <ion-input formControlName="task" type="text" placeholder="Task"></ion-input>
        </ion-item>
        <ion-note color="danger" *ngIf="taskForm.get('task')?.touched && taskForm.get('task')?.hasError('required')">
          Task is required
        </ion-note>

        <ion-item>
          <ion-label position="stacked">Prioridad</ion-label>
          <ion-select formControlName="priority" placeholder="Selecciona prioridad">
            <ion-select-option value="Importante">Importante</ion-select-option>
            <ion-select-option value="Normal">Normal</ion-select-option>
            <ion-select-option value="No importante">No importante</ion-select-option>
          </ion-select>
        <!--
          <ion-input formControlName="priority" type="number" placeholder="Priority"></ion-input>
        -->
        </ion-item>
        <ion-note color="danger" *ngIf="taskForm.get('priority')?.touched && taskForm.get('priority')?.hasError('required')">
          Priority is required
        </ion-note> 

        <ion-button 
        expand="full" 
        type="submit" 
        [disabled]="taskForm.invalid"
        [color]="isEditMode ? 'tertiary' : 'primary'">
        {{ isEditMode ? 'Actualizar' : 'Guardar' }}
        </ion-button>
      </form>
    </ion-card-content>
  </ion-card>
</ion-content>
