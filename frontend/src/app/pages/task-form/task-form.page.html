<ion-header [translucent]="true">  
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home"></ion-back-button>
      <ion-title>{{ isEditMode ? 'Actualizar Task' : 'Nueva Task' }}</ion-title>
    </ion-buttons>     
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">task-form</ion-title>
    </ion-toolbar>
  </ion-header>

  <!-- #Formulario de Tasks --> 
  <form [formGroup]="taskForm" (click)="onSubmit()">

    <ion-item>
      <ion-label position="stacked"></ion-label>
      <ion-input formControlName="title" type="text" placeholder="Title"></ion-input>
    </ion-item>
    <ion-note color="danger" *ngIf="taskForm.get('title')?.touched && taskForm.get('title')?.hasError('required')">
      Title is required
    </ion-note>
    
    <ion-item>
      <ion-label position="stacked"></ion-label>
      <ion-input formControlName="task" type="text" placeholder="Task"></ion-input>
    </ion-item>
    <ion-note color="danger" *ngIf="taskForm.get('task')?.touched && taskForm.get('task')?.hasError('required')">
      Task is required
    </ion-note>

    <ion-item>
      <ion-label position="stacked"></ion-label>
      <ion-input formControlName="priority" type="number" placeholder="Priority"></ion-input>
    </ion-item>
    <ion-note color="danger" *ngIf="taskForm.get('priority')?.touched && taskForm.get('priority')?.hasError('required')">
      Priority is required
    </ion-note>

    <ion-button 
    expand="full" 
    type="submit" 
    [disabled]="taskForm.invalid"
    [color]="isEditMode ? 'tertiary' : 'primary'">
    {{ isEditMode ? 'Actualizar' : 'Guardar' }}
    </ion-button>

  </form>











</ion-content>
