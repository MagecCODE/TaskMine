<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title class="ion-text-center">
      TaskMine
    </ion-title>
  </ion-toolbar>
</ion-header>

<ion-content  [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">TaskMine App</ion-title>
    </ion-toolbar>
  </ion-header>

<!-- Card Task -->
  <ion-card 
  class="task-card" 
  *ngFor="let task of tasksList">
    <ion-card-header>
      <ion-card-title class="car-tittle">{{task.title}}</ion-card-title>
    </ion-card-header>
    <ion-card-content class="card-content">
      {{task.task}}
    </ion-card-content>
  </ion-card>

  <!-- ** Options Float Button ** -->  
  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button>
      <ion-icon name="add"></ion-icon>
    </ion-fab-button>
    <ion-fab-list side="top">
      <ion-fab-button>
        <ion-icon name="add" (click)="newTask()"></ion-icon>
      </ion-fab-button>
      <ion-fab-button>
        <ion-icon name="share"></ion-icon>
      </ion-fab-button>
      <ion-fab-button>
        <ion-icon name="logo-whatsapp"></ion-icon>
      </ion-fab-button>    
    </ion-fab-list>
  </ion-fab>

</ion-content>
