<ion-header [translucent]="true">
  <ion-toolbar>
    <ion-title>Bienvenido a TaskMine</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content [fullscreen]="true">
  <ion-header collapse="condense">
    <ion-toolbar>
      <ion-title size="large">TaskMine Login</ion-title>
    </ion-toolbar>
  </ion-header>

  <ion-card>
    <ion-card-header>
    <ion-card-title>
      Login
    </ion-card-title>
    </ion-card-header> 

    <ion-card-content>
      <form [formGroup]="loginForm" (ngSubmit)="loginUser()">           
        <ion-item>
          <ion-input  formControlName="username" type="text" placeholder="User Name" required></ion-input>
        </ion-item>       
        <ion-item>
          <ion-input  formControlName="password" type="password" placeholder="Password" required minlength="6"></ion-input>
        </ion-item>        
        <ion-button  color="tertiary"  size="large" type="submit" [disabled]="loginForm.invalid" expand="block">Login</ion-button>           
      </form>
      <ion-text>If you don't have an account, please <a routerLink='/register'>Register</a> first!</ion-text> 
    </ion-card-content>           
  </ion-card>
</ion-content>
